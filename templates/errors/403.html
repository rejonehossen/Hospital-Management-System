{% extends 'base.html' %}
{% block title %}403 — Forbidden{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="text-center cine-reveal">
        <h1 class="display-1 fw-bold cine-grad-text mb-3">403</h1>
        <h3 class="mb-3">Access Denied</h3>
        <p class="mb-4" style="color:#8aa1bd;">You do not have permission to access this resource.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-info text-dark fw-semibold me-2">
            <i class="bi bi-grid me-2"></i>Dashboard
        </a>
        <a href="{% url 'home' %}" class="btn btn-outline-info">
            <i class="bi bi-house me-2"></i>Home
        </a>
    </div>
</div>
{% endblock %}
