{% extends 'base.html' %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="text-center cine-reveal">
        <h1 class="display-1 fw-bold cine-grad-text mb-3">500</h1>
        <h3 class="mb-3">System Interruption</h3>
        <p class="mb-4" style="color:#8aa1bd;">Our systems encountered an unexpected issue. Please try again shortly.
        </p>
        <a href="{% url 'home' %}" class="btn btn-info text-dark fw-semibold">
            <i class="bi bi-arrow-clockwise me-2"></i>Retry
        </a>
    </div>
</div>
{% endblock %}
