{% extends 'base.html' %}
{% block title %}Sign In — MediCare{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-5">
            <div class="cine-glass p-5 cine-reveal">
                <div class="text-center mb-4">
                    <i class="bi bi-heart-pulse-fill cine-glow" style="font-size:2.5rem;color:#22d3ee;"></i>
                    <h2 class="mt-3 fw-bold cine-grad-text">Welcome Back</h2>
                    <p class="small" style="color:#8aa1bd;">Sign in to access your medical command center.</p>
                </div>
                {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    <i class="bi bi-exclamation-triangle me-1"></i>Invalid username or password.
                </div>
                {% endif %}
                <form method="post" class="cine-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" name="username" id="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" name="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-info w-100 text-dark fw-semibold py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
                <p class="text-center small mt-4 mb-0" style="color:#8aa1bd;">
                    No account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Register</a>
                </p>
                <p class="text-center small mt-2 mb-0">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none" style="color:#5b7596;">
                        Forgot password?
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
