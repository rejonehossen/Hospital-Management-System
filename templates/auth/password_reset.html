{% extends 'base.html' %}
{% block title %}Reset Password — MediCare{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="cine-glass p-5 cine-reveal">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock cine-glow" style="font-size:2.5rem;color:#22d3ee;"></i>
                <h2 class="mt-3 fw-bold cine-grad-text">Reset Password</h2>
                <p class="small" style="color:#8aa1bd;">Enter your email to receive a reset link.</p>
            </div>
            <form method="post" class="cine-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-info w-100 text-dark fw-semibold py-2">
                    <i class="bi bi-envelope me-2"></i>Send Reset Link
                </button>
            </form>
            <p class="text-center small mt-4 mb-0" style="color:#8aa1bd;">
                <a href="{% url 'login' %}" class="text-info text-decoration-none">Back to Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
