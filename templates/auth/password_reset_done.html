{% extends 'base.html' %}
{% block title %}Email Sent — MediCare{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="cine-glass p-5 text-center cine-reveal" style="max-width:520px;">
        <i class="bi bi-check-circle cine-glow" style="font-size:3rem;color:#10b981;"></i>
        <h3 class="mt-3 fw-bold">Check Your Email</h3>
        <p style="color:#8aa1bd;">If an account exists for that email, you'll receive a reset link shortly.</p>
        <a href="{% url 'login' %}" class="btn btn-info text-dark fw-semibold mt-2">Back to Sign In</a>
    </div>
</div>
{% endblock %}
